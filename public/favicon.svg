<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Fabio Zacco">
  <!-- Same mark as the CMS logo, tuned for 16px: tighter padding, bold weight
       and looser tracking, because a regular serif's thin strokes disappear
       once the icon is scaled down to tab size. -->
  <rect width="512" height="512" rx="104" fill="#C4562B"/>
  <text
    x="256"
    y="366"
    text-anchor="middle"
    font-family="Instrument Serif, Georgia, 'Times New Roman', Times, serif"
    font-weight="bold"
    font-size="290"
    letter-spacing="-4"
    fill="#F7F3EC"
  >FZ</text>
</svg>
