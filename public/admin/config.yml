# Sveltia CMS configuration — https://sveltiacms.app/en/docs
#
# Backend: GitHub. Once this site is deployed on Netlify and linked to the
# repo below, Netlify's built-in OAuth handles login automatically — no
# extra setup. Not using Netlify? See README.md for the Cloudflare Workers
# OAuth proxy (sveltia-cms-auth) or the "Sign In with Token" fallback.
#
# For local editing (no GitHub login at all): open /admin/index.html in
# Chrome or Edge while `npm run dev` is running, and choose
# "Work with Local Repository" — Sveltia edits the files on disk directly
# via the File System Access API.
backend:
  name: github
  repo: fabiozakk/fabiozacco.com
  branch: main

# Replaces the default Sveltia branding on the sign-in screen, in the header,
# the browser tab, and the installed app icon.
app_title: "Fabio Zacco"
logo:
  src: /admin/logo.svg
  show_in_header: true

# The site is bilingual (English + Italian), one full file per locale —
# matches the `<content-type>/<locale>/<file>` folder layout on disk, e.g.
# `src/content/playing/en/...` next to `src/content/playing/it/...`.
i18n:
  structure: multiple_folders
  locales: [en, it]
  default_locale: en

# Where Sveltia looks for an existing entry's images when no per-field
# media_folder is set below. Every field that needs one overrides it with a
# path relative to its own content file, matching what Astro's image()
# schema helper expects.
media_folder: "src/assets"
public_folder: "/src/assets"

collections:
  - name: settings
    label: "Settings"
    # Required here, at the collection level, in addition to `i18n: true` on
    # each file below — Sveltia checks the collection flag first and won't
    # even look at a file's own i18n setting if this is missing.
    i18n: true
    editor:
      preview: false
    files:
      # `structure: multiple_folders` above only applies to the folder
      # collections below — a "files" entry like this one needs its own
      # `{{locale}}` placeholder to get a separate file per language.
      - name: site
        label: "Site"
        file: src/content/settings/{{locale}}/site.yml
        i18n: true
        # Every field needs its own `i18n` too: the field-level default is
        # `false`, which makes the field editable in the default locale only.
        # `true` = translate per language; `duplicate` = one shared value,
        # copied automatically to the other language.
        fields:
          - { label: "Name", name: name, widget: string, i18n: duplicate }
          - { label: "Tagline", name: tagline, widget: string, i18n: true }
          - label: "SEO description"
            name: seoDescription
            widget: text
            i18n: true
            hint: "Used for search engines and social link previews."
          - { label: "Contact email", name: email, widget: string, i18n: duplicate }
          - { label: "Location", name: location, widget: string, required: false, i18n: true }
          - label: "Social links"
            name: social
            widget: list
            i18n: duplicate
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: label, widget: string }
              - { label: "URL", name: url, widget: string }

      - name: hero
        label: "Hero"
        file: src/content/settings/{{locale}}/hero.yml
        i18n: true
        fields:
          - { label: "Headline", name: headline, widget: string, i18n: duplicate }
          - { label: "Subhead", name: subhead, widget: string, i18n: true }
          - label: "Background video URL"
            name: video
            widget: string
            required: false
            i18n: duplicate
            hint: "Leave empty to show the image slideshow below instead. Paste a direct .mp4 URL (e.g. hosted on your video CDN) — not a YouTube link."
          - label: "Poster image"
            name: poster
            widget: image
            i18n: duplicate
            media_folder: "../../../assets/hero"
            public_folder: "../../../assets/hero"
            hint: "Shown on mobile, with reduced motion, and while the video loads."
          - label: "Poster position"
            name: posterPosition
            widget: string
            required: false
            i18n: duplicate
            hint: "How the poster is cropped, as a CSS position (e.g. \"50% 100%\" or \"center top\"). Leave empty for centered."
          - label: "Slideshow images"
            name: images
            widget: list
            i18n: duplicate
            hint: "Used only when the background video above is empty."
            summary: "{{fields.image}}"
            fields:
              - label: "Image"
                name: image
                widget: image
                media_folder: "../../../assets/hero"
                public_folder: "../../../assets/hero"
              - label: "Position"
                name: position
                widget: string
                required: false
                hint: "How this image is cropped, as a CSS position (e.g. \"50% 100%\" or \"center top\"). Leave empty for centered."
              - label: "Mobile image (optional)"
                name: mobileImage
                widget: image
                required: false
                media_folder: "../../../assets/hero"
                public_folder: "../../../assets/hero"
                hint: "Only needed for wide group shots that lose their subject when cropped narrow — e.g. a portrait-oriented crop of the same moment. Leave empty to just reuse the image above on phones too."
              - label: "Mobile position"
                name: mobilePosition
                widget: string
                required: false
                hint: "Crop position for the mobile image above, same syntax as \"Position\". Leave empty for centered."
          - { label: "Seconds per slide", name: interval, widget: number, value_type: int, default: 5, i18n: duplicate }

      - name: bio
        label: "Bio"
        file: src/content/settings/{{locale}}/bio.md
        i18n: true
        fields:
          - label: "Portrait"
            name: portrait
            widget: image
            i18n: duplicate
            media_folder: "../../../assets/bio"
            public_folder: "../../../assets/bio"
          - label: "Portrait position"
            name: portraitPosition
            widget: string
            required: false
            i18n: duplicate
            hint: "How the portrait is cropped, as a CSS position (e.g. \"50% 100%\" or \"center top\"). Leave empty for centered."
          - { label: "Bio text", name: body, widget: markdown, i18n: true }

  - name: playing
    label: "Playing"
    label_singular: "Playing video"
    folder: src/content/playing
    i18n: true
    create: true
    slug: "{{fields.order}}-{{slug}}"
    summary: "{{title}} ({{year}})"
    fields:
      - { label: "Title", name: title, widget: string, i18n: true }
      - label: "YouTube video"
        name: youtube
        widget: string
        i18n: duplicate
        hint: "Paste any YouTube URL (full link or youtu.be) or just the video ID."
      - { label: "Role / instrument", name: role, widget: string, required: false, i18n: true }
      - { label: "Year", name: year, widget: number, value_type: int, required: false, i18n: duplicate }
      - label: "Order"
        name: order
        widget: number
        value_type: int
        default: 0
        i18n: duplicate
        hint: "Lower numbers appear first. Shared across languages, so the two versions of a video stay paired."
      - { label: "Featured (full-width card)", name: featured, widget: boolean, default: false, i18n: duplicate }
      - label: "Thumbnail override"
        name: thumbnail
        widget: image
        required: false
        i18n: duplicate
        media_folder: "../../../assets/videos"
        public_folder: "../../../assets/videos"
        hint: "Optional — by default the YouTube thumbnail is used."
      - label: "Thumbnail position"
        name: thumbnailPosition
        widget: string
        required: false
        i18n: duplicate
        hint: "How the thumbnail is cropped, as a CSS position (e.g. \"50% 100%\" or \"center top\"). Leave empty for centered."
      - { label: "Note", name: body, widget: markdown, required: false, i18n: true }

  - name: scoring
    label: "Scoring"
    label_singular: "Scoring video"
    folder: src/content/scoring
    i18n: true
    create: true
    slug: "{{fields.order}}-{{slug}}"
    summary: "{{title}} ({{year}})"
    fields:
      - { label: "Title", name: title, widget: string, i18n: true }
      - label: "YouTube video"
        name: youtube
        widget: string
        i18n: duplicate
        hint: "Paste any YouTube URL (full link or youtu.be) or just the video ID."
      - { label: "Role", name: role, widget: string, required: false, i18n: true }
      - { label: "Year", name: year, widget: number, value_type: int, required: false, i18n: duplicate }
      - label: "Order"
        name: order
        widget: number
        value_type: int
        default: 0
        i18n: duplicate
        hint: "Lower numbers appear first. Shared across languages, so the two versions of a video stay paired."
      - { label: "Featured (full-width card)", name: featured, widget: boolean, default: false, i18n: duplicate }
      - label: "Thumbnail override"
        name: thumbnail
        widget: image
        required: false
        i18n: duplicate
        media_folder: "../../../assets/videos"
        public_folder: "../../../assets/videos"
        hint: "Optional — by default the YouTube thumbnail is used."
      - label: "Thumbnail position"
        name: thumbnailPosition
        widget: string
        required: false
        i18n: duplicate
        hint: "How the thumbnail is cropped, as a CSS position (e.g. \"50% 100%\" or \"center top\"). Leave empty for centered."
      - { label: "Note", name: body, widget: markdown, required: false, i18n: true }
